name: Sync External MobileGL

on:
  workflow_dispatch:

jobs:
  sync-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download MobileGL Directory
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/herbrine8403/Amethyst-iOS-MyRemastered.git temp_repo
          cd temp_repo
          git sparse-checkout set Natives/external/MobileGL
          cd ..
          
          mkdir -p Natives/external/
          
          cp -r temp_repo/Natives/external/MobileGL Natives/external/
          rm -rf temp_repo

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Natives/external/MobileGL
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: update external MobileGL folder"
            git push origin HEAD:${{ github.ref }}
          else
            echo "MobileGL directory is up to date. No new commits were created."
          fi

